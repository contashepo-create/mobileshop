appId: com.mobileshop.erp
productName: MobileShopERP
copyright: © 2026 محاسب / محمد عبدة

directories:
  buildResources: build
  output: dist-installer

# electron-builder reads the app from the electron-forge output directory
extraMetadata:
  main: .vite/build/index.js

files:
  - .vite/build/**/*
  - .vite/renderer/**/*
  - package.json
  - node_modules/better-sqlite3/**/*
  - node_modules/bcryptjs/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - "!**/.DS_Store"

# Native modules must be unpacked from asar
asarUnpack:
  - node_modules/better-sqlite3/**

# Where the update files are served. electron-updater reads latest.yml from
# `${publish.url}/...`. We keep it pointing at the same Cloudflare Worker so
# the client key + device gating applies. The actual files sit in R2.
publish:
  provider: generic
  url: https://mobileshop-licensing.mobileshop2026.workers.dev/update-nsis/win32-x64

# NSIS installer: traditional Windows installer with path selection.
# `perMachine` is NOT set so the installer asks the user whether to install for
# all users or the current user only (electron-builder's assisted installer
# shows that page when INSTALL_MODE_PER_ALL_USERS is undefined).
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MobileShopERP
  license: build/license.txt
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  uninstallDisplayName: نظام إدارة محلات الموبايلات
  # build/installer.nsh adds a page asking for the shop's data directory and
  # writes the choice to <INSTDIR>\db_settings.json (see connection.ts).
  include: installer.nsh
  # Differential updates: NSIS installers produced by electron-builder include
  # a `.blockmap` next to the Setup exe. electron-updater uses it to download
  # only the changed 256 KB blocks instead of the whole installer, so a
  # one-line change ships as a ~5-10 MB patch rather than the full 130+ MB exe.
  differentialPackage: true

win:
  target:
    - target: nsis
      arch:
        - x64
  # Deterministic installer name so the server's latest.yml paths and the
  # publish script can reference the exact filename.
  artifactName: MobileShopERP-Setup-${version}.${ext}

electronVersion: 43.3.0
